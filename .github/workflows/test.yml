name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: docker compose -f docker-compose.test.yml run --rm tests

      - name: Dump Virtuoso log on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs virtuoso

      - name: Tear down the test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
